# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: naitv-mcp

before:
  hooks:
    - go mod tidy
    - bash scripts/completions.sh
    - bash scripts/manpages.sh

builds:
  - id: naitv-mcp
    main: ./cmd/naitv-mcp
    binary: naitv-mcp
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/madicen/naitv-mcp/internal/mcp.Version={{.Version}}

archives:
  - id: default
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE*
      - completions/*
      - manpages/*

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - Merge pull request
      - Merge branch

homebrew_casks:
  - name: naitv-mcp
    repository:
      owner: madicen
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/madicen/naitv-mcp"
    description: "Local MCP server + TUI for managing AI agent context"
    license: "MIT"
    binaries:
      - naitv-mcp
    # Unsigned GitHub release binaries are quarantined on macOS. Quarantine
    # alone is not enough on recent macOS: Gatekeeper SIGKILLs the
    # linker/ad-hoc signature (Code Signature Invalid). Strip quarantine and
    # re-sign ad-hoc on the install machine so brew users can run the binary.
    # Proper fix later: Apple Developer ID + notarization.
    caveats: |
      On macOS, if Gatekeeper blocks a GitHub/direct download ("Not Opened" /
      Code Signature Invalid), clear quarantine and re-sign ad-hoc:

        xattr -dr com.apple.quarantine "$(which naitv-mcp)"
        codesign --force --sign - "$(which naitv-mcp)"

      Or use System Settings → Privacy & Security → Open Anyway.
      Prefer `brew install --cask madicen/tap/naitv-mcp` (cask preflight handles this).
    # Must be preflight (not postflight): generate_completions_from_executable
    # runs the binary before postflight, and Gatekeeper SIGKILLs it first.
    hooks:
      pre:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/naitv-mcp"]
            run "/usr/bin/codesign", args: ["--force", "--sign", "-", "{{ .StagedPath }}/naitv-mcp"]
          end
    generate_completions_from_executable:
      executable: "naitv-mcp"
      args: ["completion"]
      shell_parameter_format: cobra
      shells: [bash, zsh, fish]

release:
  github:
    owner: madicen
    name: naitv-mcp
  draft: false
  prerelease: auto
  name_template: "v{{ .Version }}"
